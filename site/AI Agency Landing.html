<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {
  --background: 213 45% 67%;
  --foreground: 0 0% 100%;
  --glass-bg: rgba(255,255,255,.12);
  --glass-border: rgba(255,255,255,.25);

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#000;font-family:'Barlow',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

/* Liquid Glass */
.liquid-glass {
  background: rgba(255,255,255,.01);
  background-blend-mode: luminosity;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border: none;
  box-shadow: inset 0 1px 1px rgba(255,255,255,.1);
  position: relative;
  overflow: hidden;
}
.liquid-glass::before {
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;
  background: linear-gradient(180deg,
    rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,
    rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,
    rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
.liquid-glass-strong {
  background: rgba(255,255,255,.01);
  background-blend-mode: luminosity;
  backdrop-filter: blur(50px);
  -webkit-backdrop-filter: blur(50px);
  border: none;
  box-shadow: 4px 4px 4px rgba(0,0,0,.05), inset 0 1px 1px rgba(255,255,255,.15);
  position: relative;
  overflow: hidden;
}
.liquid-glass-strong::before {
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;
  background: linear-gradient(180deg,
    rgba(255,255,255,.5) 0%,rgba(255,255,255,.2) 20%,
    rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,
    rgba(255,255,255,.2) 80%,rgba(255,255,255,.5) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>
<script src="https://unpkg.com/framer-motion@11.18.0/dist/framer-motion.js"></script>

<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef } = React;
const FM = window.Motion || {};
const { motion, useInView } = FM;
const LR = window.LucideReact || {};
const { ArrowUpRight, Play, Zap, Palette, BarChart3, Shield } = LR;

// ── Utilities ─────────────────────────────────────────

function HLSVideo({ src, className, style }) {
  const ref = useRef(null);
  useEffect(() => {
    const v = ref.current;
    if (!v || !src) return;
    if (window.Hls?.isSupported()) {
      const hls = new window.Hls({ lowLatencyMode: true });
      hls.loadSource(src);
      hls.attachMedia(v);
      v.play().catch(()=>{});
      return () => hls.destroy();
    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = src;
      v.play().catch(()=>{});
    }
  }, [src]);
  return <video ref={ref} autoPlay loop muted playsInline className={className} style={style} />;
}

function BlurText({ text, className, delay = 200 }) {
  const ref = useRef(null);
  const inView = useInView ? useInView(ref, { once: true, margin: '-5% 0px' }) : true;
  const words = text.split(' ');
  if (!motion) return <span className={className}>{text}</span>;
  return (
    <span ref={ref} className={className} style={{ display:'block' }}>
      {words.map((word, i) => (
        <motion.span
          key={i}
          style={{ display:'inline-block', marginRight:'0.26em' }}
          initial={{ filter:'blur(10px)', opacity:0, y:50 }}
          animate={inView ? { filter:'blur(0px)', opacity:1, y:0 } : {}}
          transition={{ duration:0.7, delay: i*(delay/1000), ease:[0.25,0.1,0.25,1] }}
        >
          {word}
        </motion.span>
      ))}
    </span>
  );
}

function Badge({ children }) {
  return (
    <div className="liquid-glass rounded-full px-3.5 py-1 inline-flex text-xs font-medium text-white font-body">
      {children}
    </div>
  );
}

function SectionHeading({ badge, heading }) {
  return (
    <div className="flex flex-col items-center gap-5 mb-20 text-center">
      <Badge>{badge}</Badge>
      <BlurText
        text={heading}
        className="text-4xl md:text-5xl lg:text-6xl font-heading italic text-white tracking-tight leading-[0.9] max-w-2xl"
      />
    </div>
  );
}

function VideoSection({ src, children, grayscale = false, minH = 600 }) {
  return (
    <div className="relative overflow-hidden" style={{ minHeight: minH }}>
      <HLSVideo
        src={src}
        className="absolute inset-0 w-full h-full object-cover z-0"
        style={grayscale ? { filter:'saturate(0)' } : {}}
      />
      <div className="absolute top-0 inset-x-0 z-0 pointer-events-none" style={{ height:200, background:'linear-gradient(to bottom,black,transparent)' }} />
      <div className="absolute bottom-0 inset-x-0 z-0 pointer-events-none" style={{ height:200, background:'linear-gradient(to top,black,transparent)' }} />
      <div className="relative z-10 flex flex-col items-center justify-center px-6 py-24">
        {children}
      </div>
    </div>
  );
}

        ) : (

          </div>

        {/* Partners */}

            ))}
          </div>
        </div>
      </div>
    </div>
  );
}
