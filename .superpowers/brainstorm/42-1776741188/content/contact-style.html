<h2>联系板块放什么？</h2>
<p class="subtitle">这是页面的收尾 CTA，影响访客是否会主动联系你</p>

<div class="options">

  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>纯链接 + 按钮（推荐）</h3>
      <p>展示邮箱、微信、GitHub、LinkedIn图标，主按钮写「发邮件给我」直接唤起邮件客户端。简洁，零后端。</p>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
        <span style="background:rgba(255,143,171,.18);padding:6px 14px;border-radius:20px;font-size:13px">📧 邮箱</span>
        <span style="background:rgba(255,143,171,.18);padding:6px 14px;border-radius:20px;font-size:13px">💬 微信</span>
        <span style="background:rgba(255,143,171,.18);padding:6px 14px;border-radius:20px;font-size:13px">🐱 GitHub</span>
        <span style="background:rgba(255,143,171,.18);padding:6px 14px;border-radius:20px;font-size:13px">💼 LinkedIn</span>
      </div>
    </div>
  </div>

  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>联系表单</h3>
      <p>姓名 / 邮箱 / 留言三个输入框，点发送。需要接入 Formspree 或 EmailJS 等免费服务才能真正收到消息。</p>
    </div>
  </div>

  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>链接 + 简单表单</h3>
      <p>左边放社媒链接，右边放一个轻量表单，两者并排。访客可以选择最顺手的方式联系你。</p>
    </div>
  </div>

</div>
